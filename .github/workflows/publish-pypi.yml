name: Publish to PyPI

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pypi.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'Publish approved Cascade Vision distributions')
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(github.event_name == 'push' && '["v0.3.0","v0.1.0-alpha"]' || format('[{0}]', toJSON(inputs.tag))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha(\.[0-9]+)?)?$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -Fx false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ matrix.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ".[dev]"
      - name: Verify the installed version and build distributions
        env:
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          from importlib.metadata import version
          from packaging.version import Version
          assert Version(os.environ["RELEASE_TAG"]) == Version(version("cascade-vision"))
          PY
          cd "$GITHUB_WORKSPACE"
          python -m pytest -q
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions-${{ matrix.tag }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-distributions-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
