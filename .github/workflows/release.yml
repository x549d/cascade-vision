name: Release

on:
  push:
    tags: ['v*']
    branches: ['release/v0.1.0-alpha']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Select release tag
        run: echo "RELEASE_TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from cascade_vision import __version__
          from packaging.version import Version

          tag = os.environ['RELEASE_TAG']
          assert tag.startswith('v') and Version(tag) == Version(__version__)
          PY
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish release and distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if python -c 'from cascade_vision import __version__; from packaging.version import Version; raise SystemExit(not Version(__version__).is_prerelease)'; then
            flags+=(--prerelease --latest=false)
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            [[ "$GITHUB_REF_NAME" == "release/v0.1.0-alpha" ]]
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --title "cascade-vision $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" "${flags[@]}"
