name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from cascade_vision import __version__
          assert os.environ['GITHUB_REF_NAME'] == f'v{__version__}'
          PY
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish release and distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --verify-tag --title "cascade-vision $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
