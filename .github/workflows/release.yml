name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from cascade_vision import __version__
          from packaging.version import Version

          tag = os.environ['GITHUB_REF_NAME']
          assert tag.startswith('v') and Version(tag) == Version(__version__)
          PY
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish release and distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if python -c 'from cascade_vision import __version__; from packaging.version import Version; raise SystemExit(not Version(__version__).is_prerelease)'; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --verify-tag --title "cascade-vision $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" "${flags[@]}"
