name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check cascade_vision tests examples codex-plugin
      - run: python -m ruff format --check cascade_vision tests examples codex-plugin
      - run: python -m cascade_vision.cli demo --mock-vlm --report-json reports/demo.json
      - run: python examples/generate_fixture.py --output-dir reports/fixture
      - run: python -m cascade_vision.cli benchmark --manifest reports/fixture/manifest.json --output-dir reports/comparison --mock-vlm --yolo-model mock
        env:
          CASCADE_MOCK_LATENCY_S: '0'
          CASCADE_MAX_QUEUE_SIZE: '1000'
      - run: python -m build
      - run: python -m twine check dist/*
